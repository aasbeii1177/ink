<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantone Explorer — Colors, Reference Mixing &amp; Your Formulas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141414">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pantone">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#141414;
    --paper:#fafaf8;
    --paper-dim:#f0efeb;
    --line:#141414;
    --mono: 'IBM Plex Mono','Courier New',monospace;
    --serif: 'Georgia','Iowan Old Style',serif;
    --arabic-ui: 'Noto Kufi Arabic', 'Noto Sans Arabic', sans-serif;
    --arabic-serif: 'Noto Sans Arabic', 'Noto Kufi Arabic', sans-serif;
    --mine:#c8102e;
    --sync:#0058a3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
  }
  html[dir="rtl"] body{ font-family: var(--arabic-ui); }
  html[dir="rtl"] .brand h1,
  html[dir="rtl"] .modal-info h2{ font-family: var(--arabic-ui); }
  html[dir="rtl"] .note{ font-family: var(--arabic-serif); font-style:normal; }
  html[dir="rtl"] .empty-msg,
  html[dir="rtl"] .mine-empty{ font-family: var(--arabic-serif); font-style:normal; }
  a{color:inherit;}
  .ltr{ direction:ltr; unicode-bidi:isolate; }

  header.top{
    border-bottom:2px solid var(--line);
    padding:24px 28px 18px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:50;
  }
  .brand{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;}
  .brand h1{ font-family:var(--serif); font-size:24px; font-weight:700; margin:0; letter-spacing:-0.01em; }
  .brand .tag{ font-size:10px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.55; display:block; margin-top:2px; }
  html[dir="rtl"] .brand .tag{ letter-spacing:0; text-transform:none; }
  .header-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .swatch-count{ font-size:11px; letter-spacing:0.08em; text-transform:uppercase; text-align:end; line-height:1.5; }
  html[dir="rtl"] .swatch-count{ letter-spacing:0; text-transform:none; }
  .swatch-count b{font-family:var(--serif); font-size:16px; display:block;}
  html[dir="rtl"] .swatch-count b{ font-family: var(--arabic-ui); }

  #langToggle, #syncToggle{
    border:1.5px solid var(--line);
    background:var(--ink);
    color:var(--paper);
    padding:9px 14px;
    font-family:inherit;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    cursor:pointer;
    white-space:nowrap;
  }
  #syncToggle{ background:var(--sync); border-color:var(--sync); position:relative; }
  #syncToggle.connected::after{
    content:''; position:absolute; top:-3px; inset-inline-end:-3px;
    width:8px; height:8px; border-radius:50%; background:#3fb950; border:1.5px solid var(--paper);
  }
  #langToggle:hover, #syncToggle:hover{opacity:0.85;}

  .controls{
    padding:14px 28px; border-bottom:1px solid var(--line);
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    position:sticky; background:var(--paper); z-index:40;
  }
  #famControls{ top:73px; }
  #collControls{ top:127px; }
  input#search{
    flex:1 1 200px; min-width:160px; padding:9px 12px;
    border:1.5px solid var(--line); background:var(--paper);
    font-family:inherit; font-size:13px; color:var(--ink); outline:none;
  }
  input#search:focus{background:#fff;}
  .fam-btn{
    border:1.5px solid var(--line); background:transparent; padding:8px 11px;
    font-family:inherit; font-size:11px; letter-spacing:0.05em; text-transform:uppercase;
    cursor:pointer; color:var(--ink); white-space:nowrap;
  }
  html[dir="rtl"] .fam-btn{ letter-spacing:0; text-transform:none; }
  .fam-btn.active{background:var(--ink); color:var(--paper);}
  .fam-btn:hover{opacity:0.8;}
  .fam-btn.mine{border-color:var(--mine); color:var(--mine);}
  .fam-btn.mine.active{background:var(--mine); color:#fff; border-color:var(--mine);}
  .coll-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.08em; opacity:0.5; margin-inline-end:2px; }
  html[dir="rtl"] .coll-label{ letter-spacing:0; text-transform:none; }

  main{padding:20px 28px 60px;}
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); }
  .cell{ background:#fff; cursor:pointer; display:flex; flex-direction:column; transition:transform 0.1s ease; position:relative; }
  .cell:hover{transform:translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,0.18); z-index:2;}
  .cell .sw{ aspect-ratio:1/1; width:100%; position:relative;}
  .cell .mine-dot{ position:absolute; top:5px; inset-inline-end:5px; width:9px; height:9px; border-radius:50%; background:var(--mine); border:1.5px solid #fff; }
  .cell .meta{ padding:6px 7px 8px; }
  .cell .code{ font-size:10.5px; font-weight:700; letter-spacing:0.01em; word-break:break-word;}
  .empty-msg{ font-family:var(--serif); font-size:15px; opacity:0.6; padding:40px 4px; grid-column:1/-1;}

  .overlay{ position:fixed; inset:0; background:rgba(20,20,20,0.6); display:none; align-items:center; justify-content:center; padding:20px; z-index:100; }
  .overlay.open{display:flex;}
  .modal{ background:var(--paper); max-width:760px; width:100%; max-height:90vh; overflow-y:auto; border:2px solid var(--line); position:relative; }
  .modal.narrow{ max-width:560px; }
  .modal-head{ display:flex; }
  .modal-sw{width:170px; min-width:170px;}
  .modal-info{padding:20px 22px; flex:1;}
  .modal-info h2{ font-family:var(--serif); font-size:23px; margin:0 0 2px;}
  .modal-info .sub{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; opacity:0.55; margin-bottom:12px;}
  html[dir="rtl"] .modal-info .sub{ letter-spacing:0; text-transform:none; }
  .close-btn{ position:absolute; top:10px; inset-inline-end:14px; background:none; border:none; font-family:inherit; font-size:20px; cursor:pointer; color:#fff; mix-blend-mode:difference; z-index:5; }
  .value-row{ display:flex; gap:20px; flex-wrap:wrap; font-size:12px; margin-top:8px;}
  .value-row div b{display:block; font-size:9px; text-transform:uppercase; letter-spacing:0.08em; opacity:0.5; margin-bottom:3px; font-weight:400;}
  html[dir="rtl"] .value-row div b{ letter-spacing:0; text-transform:none; }
  .value-row div span{font-size:13px; font-weight:700;}

  .modal-body{padding:0 22px 24px;}
  .section-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.1em; border-top:1px solid var(--line); padding-top:14px; margin-top:18px; opacity:0.55; display:flex; justify-content:space-between; align-items:center; }
  html[dir="rtl"] .section-label{ letter-spacing:0; text-transform:none; }
  .recipe{ display:flex; flex-direction:column; gap:8px; margin-top:12px;}
  .bar-row{ display:grid; grid-template-columns:80px 1fr 42px; align-items:center; gap:10px; font-size:12px;}
  .bar-track{ height:12px; background:var(--paper-dim); border:1px solid var(--line); position:relative;}
  .bar-fill{height:100%;}
  .note{ font-family:var(--serif); font-style:italic; font-size:13px; line-height:1.55; margin-top:14px; opacity:0.85;}
  .disclaimer{ font-size:10.5px; line-height:1.6; opacity:0.55; margin-top:16px; border-top:1px dashed var(--line); padding-top:12px;}
  .cmyk-swatch{ display:inline-block; width:10px;height:10px; margin-inline-end:6px; vertical-align:middle;}

  .mine-box{ border:1.5px solid var(--mine); padding:14px 14px 16px; margin-top:12px; }
  .mine-box .hdr{ display:flex; justify-content:space-between; align-items:center; font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--mine); font-weight:700; margin-bottom:10px; }
  html[dir="rtl"] .mine-box .hdr{ letter-spacing:0; text-transform:none; }
  .ing-row{ display:grid; grid-template-columns:1fr 70px 60px 24px; gap:6px; margin-bottom:6px; align-items:center;}
  .ing-row input{ font-family:inherit; font-size:12px; padding:6px 7px; border:1px solid var(--line); background:#fff; color:var(--ink); }
  .ing-row button{ border:1px solid var(--line); background:#fff; cursor:pointer; font-size:13px; padding:4px 0; }
  .add-ing-btn{ font-family:inherit; font-size:11px; border:1px dashed var(--line); background:none; padding:6px 10px; cursor:pointer; margin-top:2px; }
  textarea#mineNotes{ width:100%; font-family:inherit; font-size:12px; padding:8px; border:1px solid var(--line); background:#fff; color:var(--ink); margin-top:10px; min-height:56px; resize:vertical; }
  .mine-actions{ display:flex; gap:8px; margin-top:10px; align-items:center;}
  .save-btn{ font-family:inherit; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; background:var(--mine); color:#fff; border:none; padding:9px 14px; cursor:pointer; }
  html[dir="rtl"] .save-btn{ letter-spacing:0; text-transform:none; }
  .clear-btn{ font-family:inherit; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; background:none; color:var(--ink); border:1px solid var(--line); padding:9px 12px; cursor:pointer; }
  html[dir="rtl"] .clear-btn{ letter-spacing:0; text-transform:none; }
  .saved-flash{ font-size:11px; opacity:0.6; }
  .mine-empty{ font-size:12px; opacity:0.6; font-family:var(--serif); font-style:italic;}

  /* sync panel */
  .sync-field{ margin-bottom:12px; }
  .sync-field label{ display:block; font-size:10px; text-transform:uppercase; letter-spacing:0.08em; opacity:0.6; margin-bottom:5px; }
  html[dir="rtl"] .sync-field label{ letter-spacing:0; text-transform:none; }
  .sync-field input{ width:100%; font-family:inherit; font-size:13px; padding:9px 10px; border:1.5px solid var(--line); background:#fff; color:var(--ink); }
  .sync-note{ font-size:11px; line-height:1.6; opacity:0.7; background:var(--paper-dim); border:1px solid var(--line); padding:10px 12px; margin-bottom:14px; }
  .sync-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .sync-btn-primary{ font-family:inherit; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; background:var(--sync); color:#fff; border:none; padding:10px 16px; cursor:pointer; }
  html[dir="rtl"] .sync-btn-primary{ letter-spacing:0; text-transform:none; }
  .sync-btn-secondary{ font-family:inherit; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; background:none; border:1px solid var(--line); padding:10px 14px; cursor:pointer; }
  html[dir="rtl"] .sync-btn-secondary{ letter-spacing:0; text-transform:none; }
  .sync-status{ font-size:12px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); line-height:1.6; }
  .bin-id-display{ font-weight:700; background:var(--paper-dim); padding:2px 6px; cursor:pointer; border:1px dashed var(--line); }

  footer{ padding:24px 28px 50px; font-size:11px; opacity:0.5; line-height:1.7; max-width:680px;}

  @media (max-width:560px){
    .modal-head{flex-direction:column;}
    .modal-sw{width:100%; height:110px;}
    header.top{padding:18px 16px 14px;}
    .controls{padding:12px 16px;}
    #famControls{top:66px;}
    #collControls{top:120px;}
    main{padding:16px 16px 50px;}
    footer{padding:18px 16px 40px;}
    .ing-row{grid-template-columns:1fr 60px 50px 22px;}
  }
</style>
</head>
<body>

<div id="appShell" style="display:none;">
<header class="top">
  <div class="brand">
    <h1 data-i18n="title">Pantone Explorer</h1>
    <span class="tag" data-i18n="tagline">Reference Colors &amp; Your Mixing Formulas</span>
  </div>
  <div class="header-right">
    <div class="swatch-count"><b id="countNum">—</b><span data-i18n="swatchesShown">swatches shown</span></div>
    <span class="swatch-count ltr" id="syncIndicator" style="font-size:10px;"></span>
    <button id="signOutBtn" type="button" data-i18n="signOut" style="border:1.5px solid var(--line); background:transparent; padding:9px 12px; font-family:inherit; font-size:11px; cursor:pointer; color:var(--ink);">Sign out</button>
    <button id="langToggle" type="button">العربية</button>
  </div>
</header>

<div class="controls" id="famControls">
  <input id="search" type="text" autocomplete="off">
  <button class="fam-btn active" data-fam="all" data-i18n="fam_all">All</button>
  <button class="fam-btn" data-fam="red" data-i18n="fam_red">Red</button>
  <button class="fam-btn" data-fam="orange" data-i18n="fam_orange">Orange</button>
  <button class="fam-btn" data-fam="yellow" data-i18n="fam_yellow">Yellow</button>
  <button class="fam-btn" data-fam="green" data-i18n="fam_green">Green</button>
  <button class="fam-btn" data-fam="blue" data-i18n="fam_blue">Blue</button>
  <button class="fam-btn" data-fam="purple" data-i18n="fam_purple">Purple</button>
  <button class="fam-btn" data-fam="pink" data-i18n="fam_pink">Pink</button>
  <button class="fam-btn" data-fam="neutral" data-i18n="fam_neutral">Neutral</button>
  <button class="fam-btn mine" data-fam="mine" data-i18n="fam_mine">● My Mixes</button>
</div>
<div class="controls" id="collControls">
  <span class="coll-label" data-i18n="collLabel">Collection:</span>
  <button class="fam-btn coll-btn active" data-coll="all" data-i18n="coll_all">All</button>
  <button class="fam-btn coll-btn" data-coll="coated" data-i18n="coll_coated">Solid Coated</button>
  <button class="fam-btn coll-btn" data-coll="uncoated" data-i18n="coll_uncoated">Solid Uncoated</button>
  <button class="fam-btn coll-btn" data-coll="tcx" data-i18n="coll_tcx">TCX Fashion/Home</button>
  <button class="fam-btn coll-btn" data-coll="metallic" data-i18n="coll_metallic">Metallic</button>
  <button class="fam-btn coll-btn" data-coll="pastel-neon" data-i18n="coll_pastel">Pastels &amp; Neons</button>
  <button class="fam-btn coll-btn" data-coll="skin" data-i18n="coll_skin">Skin Tones</button>
</div>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer data-i18n="footer"></footer>
</div>
<!-- /appShell -->

<!-- Login gate -->
<div class="overlay open" id="loginOverlay" style="background:var(--paper);">
  <div class="modal narrow" style="border:none;">
    <div class="modal-body" style="padding:30px 26px;">
      <h2 style="font-family:var(--serif); font-size:22px; margin:0 0 4px;" data-i18n="loginTitle">Sign in</h2>
      <div style="font-size:12px; opacity:0.6; margin-bottom:20px;" data-i18n="loginSubtitle">Shared team login</div>
      <div class="sync-field">
        <label data-i18n="loginUsernameLabel">Username</label>
        <input type="text" id="loginEmail" class="ltr" autocomplete="username">
      </div>
      <div class="sync-field">
        <label data-i18n="loginPasswordLabel">Password</label>
        <input type="password" id="loginPassword" class="ltr" autocomplete="current-password">
      </div>
      <button class="sync-btn-primary" id="loginSubmitBtn" style="width:100%; padding:11px;" data-i18n="loginSubmit">Sign in</button>
      <div class="sync-status" id="loginStatus" style="border-top:none; padding-top:10px; min-height:16px;"></div>
    </div>
  </div>
</div>

<!-- Color detail modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close-btn" id="closeBtn">✕</button>
    <div class="modal-head">
      <div class="modal-sw" id="modalSw"></div>
      <div class="modal-info">
        <h2 id="modalName" class="ltr"></h2>
        <div class="sub" id="modalCode"></div>
        <div class="value-row">
          <div><b>Hex</b><span id="valHex" class="ltr"></span></div>
          <div><b>RGB</b><span id="valRgb" class="ltr"></span></div>
          <div><b id="cmykLabel">CMYK (approx.)</b><span id="valCmyk" class="ltr"></span></div>
        </div>
      </div>
    </div>
    <div class="modal-body">
      <div class="section-label" data-i18n="refMixHeader">Reference mixing guide (computed, approximate)</div>
      <div class="recipe" id="recipe"></div>
      <div class="note" id="mixNote"></div>

      <div class="section-label" style="border-top:none; margin-top:22px;">
        <span data-i18n="yourMixHeader">Your mixing formula</span>
        <span class="saved-flash" id="savedFlash"></span>
      </div>
      <div class="mine-box">
        <div class="hdr"><span id="mineStatus">Not saved yet</span></div>
        <div id="ingList"></div>
        <button class="add-ing-btn" id="addIngBtn" data-i18n="addIngredient">+ add ingredient</button>
        <textarea id="mineNotes"></textarea>
        <div class="mine-actions">
          <button class="save-btn" id="saveMineBtn" data-i18n="save">Save my mix</button>
          <button class="clear-btn" id="clearMineBtn" data-i18n="delete">Delete</button>
        </div>
      </div>

      <div class="disclaimer" id="modalDisclaimer"></div>
    </div>
  </div>
</div>

<script>

// ---------- Storage abstraction: window.storage (Claude) or localStorage (standalone) ----------
const hasClaudeStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');
async function devGet(key){
  if(hasClaudeStorage){
    try{ const r = await window.storage.get(key, false); return r ? r.value : null; }catch(e){ return null; }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function devSet(key, value){
  if(hasClaudeStorage){
    try{ await window.storage.set(key, value, false); return true; }catch(e){ return false; }
  }
  try{ localStorage.setItem(key, value); return true; }catch(e){ return false; }
}

// ---------- Color math ----------
function hexToRgb(hex){
  hex = hex.replace('#','');
  return { r: parseInt(hex.substring(0,2),16), g: parseInt(hex.substring(2,4),16), b: parseInt(hex.substring(4,6),16) };
}
function rgbToHsl(r,g,b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h,s,l=(max+min)/2;
  if(max===min){ h=s=0; }
  else{
    const d=max-min;
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: h=(g-b)/d+(g<b?6:0); break;
      case g: h=(b-r)/d+2; break;
      case b: h=(r-g)/d+4; break;
    }
    h*=60;
  }
  return {h,s:s*100,l:l*100};
}
function rgbToCmyk(r,g,b){
  let c=1-r/255, m=1-g/255, y=1-b/255;
  const k=Math.min(c,m,y);
  if(k>=1) return {c:0,m:0,y:0,k:100};
  c=(c-k)/(1-k); m=(m-k)/(1-k); y=(y-k)/(1-k);
  return {c:Math.round(c*100), m:Math.round(m*100), y:Math.round(y*100), k:Math.round(k*100)};
}
function familyOf(hex){
  const {r,g,b} = hexToRgb(hex);
  const {h,s,l} = rgbToHsl(r,g,b);
  if(s<12 || l>96 || l<6) return 'neutral';
  if(h<15 || h>=345) return 'red';
  if(h<45) return 'orange';
  if(h<70) return 'yellow';
  if(h<170) return 'green';
  if(h<255) return 'blue';
  if(h<290) return 'purple';
  return 'pink';
}
const WHEEL = [
  {h:0,   mix:{red:100, yellow:0,  blue:0}},
  {h:60,  mix:{red:55,  yellow:45, blue:0}},
  {h:120, mix:{red:0,   yellow:100,blue:0}},
  {h:180, mix:{red:0,   yellow:55, blue:45}},
  {h:240, mix:{red:0,   yellow:0,  blue:100}},
  {h:300, mix:{red:45,  yellow:0,  blue:55}},
  {h:360, mix:{red:100, yellow:0,  blue:0}},
];
function hueToRYB(h){
  for(let i=0;i<WHEEL.length-1;i++){
    const a=WHEEL[i], b=WHEEL[i+1];
    if(h>=a.h && h<=b.h){
      const t=(h-a.h)/(b.h-a.h);
      return {
        red:    a.mix.red    + (b.mix.red    - a.mix.red)*t,
        yellow: a.mix.yellow + (b.mix.yellow - a.mix.yellow)*t,
        blue:   a.mix.blue   + (b.mix.blue   - a.mix.blue)*t,
      };
    }
  }
  return WHEEL[0].mix;
}
function mixRecipe(hex){
  const {r,g,b} = hexToRgb(hex);
  const {h,s,l} = rgbToHsl(r,g,b);
  const hue = hueToRYB(h);
  const hueShare = s/100;
  const neutralShare = 1-hueShare;
  const whiteFromNeutral = neutralShare * (l/100);
  const blackFromNeutral = neutralShare * (1-l/100);
  let white = whiteFromNeutral, black = blackFromNeutral;
  if(l>50){ white += hueShare * ((l-50)/50) * 0.5; }
  if(l<50){ black += hueShare * ((50-l)/50) * 0.5; }
  const hueTotal = Math.max(0, 1 - white - black);
  const red    = (hue.red/100)    * hueTotal;
  const yellow = (hue.yellow/100) * hueTotal;
  const blue   = (hue.blue/100)   * hueTotal;
  let parts = {red,yellow,blue,white,black};
  const sum = Object.values(parts).reduce((a,c)=>a+c,0) || 1;
  Object.keys(parts).forEach(k=>parts[k] = Math.round((parts[k]/sum)*100));
  const drift = 100 - Object.values(parts).reduce((a,c)=>a+c,0);
  const maxKey = Object.keys(parts).reduce((a,b)=>parts[a]>parts[b]?a:b);
  parts[maxKey]+=drift;
  return parts;
}

const SYNC_CODE = "printingink-mixes";

let myMixes = {};          // code -> {ingredients, notes, updated, deleted}
let myMixCodesSet = new Set();
let fbApp = null, fbDb = null, fbUnsub = null;
let currentSyncState = 'syncing';

function recomputeMixCodesSet(){
  myMixCodesSet = new Set(Object.keys(myMixes).filter(c => myMixes[c] && !myMixes[c].deleted));
}
async function loadMyMixesLocal(){
  const raw = await devGet('myMixesData');
  try{ myMixes = raw ? JSON.parse(raw) : {}; }catch(e){ myMixes = {}; }
  recomputeMixCodesSet();
}
async function saveMyMixesLocal(){
  await devSet('myMixesData', JSON.stringify(myMixes));
  recomputeMixCodesSet();
}

function mergeMixes(local, cloud){
  const merged = Object.assign({}, local);
  for(const code in cloud){
    const c = cloud[code];
    const l = local[code];
    if(!l) merged[code] = c;
    else if((c.updated||'') >= (l.updated||'')) merged[code] = c;
  }
  return merged;
}

function ensureFirebaseApp(){
  if(fbApp) return true;
  try{
    if(typeof firebase === 'undefined') return false;
    fbApp = (firebase.apps && firebase.apps.length) ? firebase.apps[0] : firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.firestore();
    return true;
  }catch(e){ return false; }
}

function fbDocRef(){
  if(!fbDb) return null;
  return fbDb.collection('pantoneMixes').doc(SYNC_CODE);
}

async function cloudPush(){
  const ref = fbDocRef();
  if(!ref) return {ok:false, reason:'not-configured'};
  try{
    await ref.set({ data: myMixes, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    return {ok:true};
  }catch(e){ return {ok:false, reason: (e && e.code==='permission-denied') ? 'rules' : 'error'}; }
}
async function cloudPull(){
  const ref = fbDocRef();
  if(!ref) return {ok:false, reason:'not-configured'};
  try{
    const snap = await ref.get();
    return {ok:true, data: snap.exists ? (snap.data().data || {}) : {}};
  }catch(e){ return {ok:false, reason: (e && e.code==='permission-denied') ? 'rules' : 'error'}; }
}

function startRealtimeListener(){
  const ref = fbDocRef();
  if(!ref) return;
  if(fbUnsub) fbUnsub();
  fbUnsub = ref.onSnapshot(snap=>{
    if(!snap.exists || snap.metadata.hasPendingWrites) return;
    const cloudData = snap.data().data || {};
    const merged = mergeMixes(myMixes, cloudData);
    if(JSON.stringify(merged) !== JSON.stringify(myMixes)){
      myMixes = merged;
      saveMyMixesLocal();
      render();
    }
    setSyncIndicator('synced');
  }, ()=>{ setSyncIndicator('offline'); });
}

function setSyncIndicator(state){
  currentSyncState = state;
  const el = document.getElementById('syncIndicator');
  if(!el) return;
  const t = STR[currentLang];
  if(state==='syncing') el.textContent = t.syncIndSyncing;
  else if(state==='synced') el.textContent = t.syncIndSynced;
  else el.textContent = t.syncIndOffline;
}

async function doFullSync(){
  setSyncIndicator('syncing');
  if(!ensureFirebaseApp()){ setSyncIndicator('offline'); return false; }
  const pull = await cloudPull();
  if(pull.ok){
    myMixes = mergeMixes(myMixes, pull.data || {});
    await saveMyMixesLocal();
  }
  const push = await cloudPush();
  if(!push.ok && !pull.ok){ setSyncIndicator('offline'); return false; }
  startRealtimeListener();
  setSyncIndicator('synced');
  render();
  return true;
}

const grid = document.getElementById('grid');

let activeFam = 'all';
let activeColl = 'all';

const COLL_KEY = {
  coated:'coll_coated', uncoated:'coll_uncoated', tcx:'coll_tcx',
  metallic:'coll_metallic', 'pastel-neon':'coll_pastel', skin:'coll_skin'
};

function render(){
  const q = query.trim().toLowerCase();
  const filtered = COLORS.filter(c=>{
    const [code, hex, coll] = c;
    const qOk = !q || code.toLowerCase().includes(q);
    if(!qOk) return false;
    if(activeColl !== 'all' && coll !== activeColl) return false;
    if(activeFam === 'mine') return myMixCodesSet.has(code);
    if(activeFam === 'all') return true;
    return familyOf(hex) === activeFam;
  });

  countNum.textContent = filtered.length;
  grid.innerHTML = '';
  if(filtered.length===0){
    grid.innerHTML = `<div class="empty-msg">${STR[currentLang].noMatch}</div>`;
    return;
  }
  const frag = document.createDocumentFragment();
  filtered.slice(0, 4000).forEach(c=>{
    const [code,hex] = c;
    const cell = document.createElement('div');
    cell.className='cell';
    const dot = myMixCodesSet.has(code) ? '<div class="mine-dot"></div>' : '';
    cell.innerHTML = `<div class="sw" style="background:${hex}">${dot}</div><div class="meta"><div class="code ltr">${code}</div></div>`;
    cell.addEventListener('click',()=>openModal(c));
    frag.appendChild(cell);
  });
  grid.appendChild(frag);
}

      </div>`).join('');

  const dominant = order.filter(k=>k!=='white'&&k!=='black').sort((a,b)=>recipe[b]-recipe[a])[0];
  const {h,s,l} = rgbToHsl(r,g,b);
  let bit1, bit2;

  document.getElementById('savedFlash').textContent = '';

let appInitialized = false;
async function loadLangAndApply(){
  let savedLang = await devGet('lang');
  if(savedLang !== 'en' && savedLang !== 'ar') savedLang = 'en';
  currentLang = savedLang;
  document.getElementById('htmlRoot').setAttribute('lang', savedLang);
  document.getElementById('htmlRoot').setAttribute('dir', STR[savedLang].dir);
  applyStaticI18n();
}
async function initApp(){
  if(appInitialized) return;
  appInitialized = true;
  await loadMyMixesLocal();
  render();
  doFullSync();
}

function showLogin(){
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('loginOverlay').classList.add('open');
}
function showApp(){
  document.getElementById('loginOverlay').classList.remove('open');
  document.getElementById('appShell').style.display = 'block';
  initApp();
}

const AUTH_ERROR_KEY = {
  'auth/wrong-password':'loginErrBadCreds', 'auth/user-not-found':'loginErrBadCreds',
  'auth/invalid-email':'loginErrBadCreds', 'auth/invalid-credential':'loginErrBadCreds',
  'auth/too-many-requests':'loginErrThrottled', 'auth/network-request-failed':'loginErrNetwork'
};
const USERNAME_EMAIL_DOMAIN = 'printingink-login.app';
function attemptLogin(){
  const t = STR[currentLang];
  const statusEl = document.getElementById('loginStatus');
  const username = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPassword').value;
  if(!username || !pass){ statusEl.textContent = t.loginErrEmpty; return; }
  if(!ensureFirebaseApp()){ statusEl.textContent = t.loginErrNetwork; return; }
  const email = username.includes('@') ? username : (username.replace(/[^a-z0-9._-]/g,'') + '@' + USERNAME_EMAIL_DOMAIN);
  statusEl.textContent = t.loginSigningIn;
  firebase.auth().signInWithEmailAndPassword(email, pass).catch(err=>{
    statusEl.textContent = t[AUTH_ERROR_KEY[err.code]] || t.loginErrGeneric;
  });
}
document.getElementById('loginSubmitBtn').addEventListener('click', attemptLogin);
document.getElementById('loginEmail').addEventListener('keydown', e=>{ if(e.key==='Enter') attemptLogin(); });
document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') attemptLogin(); });

document.getElementById('signOutBtn').addEventListener('click', ()=>{
  if(fbUnsub){ fbUnsub(); fbUnsub = null; }
  if(typeof firebase !== 'undefined') firebase.auth().signOut();
});

(async function initAuthGate(){
  await loadLangAndApply();
  if(!ensureFirebaseApp()){ showLogin(); return; }
  firebase.auth().onAuthStateChanged(user=>{
    if(user){ showApp(); }
    else{ showLogin(); }
  });
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline caching just won't be available */ });
  });
}
</script>
